- generic [active] [ref=f3e1]: "{\"week_summary\":\"Semana 1 (23-29 ago): el atleta presenta señales claras de fatiga acumulada — HRV en tendencia descendente (último valor 35 ms, muy por debajo del promedio), FC reposo elevada con pico de 67 bpm, sueño deteriorado (37/100 en el peor día, promedio 62/100) y dos sesiones de alta intensidad en los últimos 5 días. El plan Runna ya incluye una sesión ALTA el lunes 24 y un Long Run el martes 25, lo que deja sin ventanas viables para ciclismo adicional en semana 1 sin comprometer la recuperación. El ciclismo del 26-ago ya está integrado en el plan Runna. Semana 2 (30 ago - 5 sep): se proyecta una recuperación parcial del HRV y normalización de la FC reposo; el plan Runna incluye tres sesiones de ciclismo Z1 ya pautadas (31-ago, 2-sep, 3-sep), lo que cubre el volumen aeróbico complementario sin necesidad de añadir sesiones adicionales.\",\"athlete_state\":\"fatigued\",\"weeks_plan\":[{\"week_start\":\"2026-08-23\",\"week_end\":\"2026-08-29\",\"week_type\":\"carga_moderada\",\"purpose\":\"Completar la semana 9-10 del plan Runna absorbiendo las sesiones de calidad (Tempo 5km el lunes y Long Run 17km el martes) sin añadir estrés adicional de ciclismo más allá del ya programado. El objetivo es no profundizar la fatiga actual y permitir que el cuerpo asimile el estímulo de las sesiones duras. El ciclismo Z1 del miércoles 26 (ya en el plan Runna) actúa como recuperación activa antes del Time Trial del jueves.\",\"macro_context\":\"Esta semana representa un bloque de carga dentro de la fase de construcción hacia el medio maratón; la fatiga actual es esperada en esta etapa, pero debe gestionarse para no comprometer el Time Trial del jueves ni el descanso estructural de fin de semana.\",\"load_expectation\":\"Volumen de carrera moderado-alto (~44 km totales entre lunes y viernes). Intensidad concentrada en lunes (ALTA) y martes (MODERADA). El miércoles y viernes son días de baja intensidad. El ciclismo del miércoles es Z1 puro (~50 min), ya incluido en Runna. No se añade ciclismo extra esta semana.\"},{\"week_start\":\"2026-08-30\",\"week_end\":\"2026-09-05\",\"week_type\":\"recuperacion\",\"purpose\":\"Consolidar las adaptaciones de las semanas previas con una carga reducida dominada por volumen Z1. El Long Run del domingo (10 km MODERADA) abre la semana con estímulo aeróbico controlado, y las tres sesiones de ciclismo Z1 ya programadas en Runna (lunes 31, miércoles 2, jueves 3) cubren el volumen complementario necesario. El foco es recuperación activa y restauración de los marcadores de HRV y FC reposo.\",\"macro_context\":\"Semana de descarga táctica que permite al atleta llegar con frescura a la siguiente fase de carga; en la periodización hacia el medio maratón, esta semana funciona como válvula de alivio antes de retomar bloques de mayor intensidad.\",\"load_expectation\":\"Volumen de carrera bajo (solo Long Run 10 km el domingo). Tres sesiones de ciclismo Z1 de corta duración (45-40 min cada una) distribuidas en lunes, miércoles y jueves. Todo el ciclismo en Z1 máximo. Sin sesiones de alta intensidad programadas en Runna esta semana. Distribución de zonas estimada: >85% Z1, <10% Z2, <5% Z3.\"}],\"cycling_sessions\":[],\"load_analysis\":{\"last_3_weeks_avg_weekly_hours\":2.8,\"this_week_running_hours\":3.15,\"this_week_cycling_hours_added\":0,\"estimated_zone_distribution\":{\"Z1_pct\":38,\"Z2_pct\":22,\"Z3_pct\":40},\"fatigue_signals\":\"HRV promedio 42.6 ms con tendencia descendente marcada (último valor 35 ms, caída del 39% respecto al máximo semanal de 58 ms). FC reposo con tendencia ascendente, pico de 67 bpm el viernes 21. Calidad de sueño deteriorada, promedio 62/100 con valor mínimo de 37/100. Dos sesiones de carrera en Z3 (HR avg 163 bpm) en los últimos 5 días. La combinación de estos cuatro indicadores apunta a fatiga acumulada real, no transitoria. El plan Runna ya programa sesión ALTA el lunes 24 y Long Run el martes 25, lo que no deja margen para ciclismo adicional sin riesgo de sobreentrenamiento. Las sesiones de ciclismo de la semana 2 ya están integradas en el plan Runna (31-ago, 2-sep, 3-sep) y son todas Z1 puro, apropiadas para el estado de recuperación proyectado.\"},\"scientific_rationale\":\"Dado el estado de fatiga documentado (HRV ↓, FC reposo ↑, sueño deteriorado), aplicar el principio de recuperación entre sesiones duras (Sandbakk et al. 2025) dictamina priorizar la absorción de los estímulos de calidad de Runna sobre cualquier volumen adicional de ciclismo en semana 1. En semana 2, las tres sesiones de ciclismo Z1 ya programadas en el plan Runna cumplen exactamente el rol de 'relleno aeróbico de bajo costo fisiológico' descrito por Seiler & Tønnessen (2009), complementando el Long Run sin competir con él. La distribución polarizada (≥75% Z1) se mantiene en la semana de recuperación mediante ciclismo Z1 puro, evitando el acúmulo de carga en Z2 que, especialmente en altitud (2.600 m), incrementa el estrés cardiovascular un 10-15% adicional respecto al nivel del mar.\",\"runna_sessions\":[{\"date\":\"2026-08-24\",\"name\":\"W9 Mon Tempo - Tempo 5km (8km)\",\"sport\":\"running\",\"workout_id\":1660294201,\"garmin_workout\":{\"workoutId\":1660294201,\"ownerId\":122925975,\"workoutName\":\"W9 Mon Tempo - Tempo 5km (8km)\",\"description\":\"Half Marathon Plan (Week 10/15)\\n\\n1.5km warm up at a conversational pace (no faster than 5:30/km)\\n\\n5km at 4:40/km (4:30-4:50/km), 150s walking rest\\n\\n1.5km cool down at a conversational pace (or slower!)\",\"updatedDate\":\"2026-08-24T03:08:51.0\",\"createdDate\":\"2026-08-10T08:03:40.0\",\"sportType\":{\"sportTypeId\":1,\"sportTypeKey\":\"running\",\"displayOrder\":1},\"subSportType\":null,\"trainingPlanId\":null,\"author\":{\"userProfilePk\":122925975,\"displayName\":\"2b5b14c4-2271-4b82-969f-d578be4652bf\",\"fullName\":\"Jose Martin Perilla\",\"profileImgNameLarge\":null,\"profileImgNameMedium\":\"dfac5bcf-d36f-41ec-b546-5b2543af2d3d-prfr.png\",\"profileImgNameSmall\":\"dfac5bcf-