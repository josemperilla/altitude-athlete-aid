a 2 sin sesión de Runna ni ciclismo ya programado en el plan Runna (lunes 31 y miércoles 2 ya tienen ciclismo; domingo 30 tiene long run moderado). Se elige ciclorruta en plano porque el atleta llega fatigado a la semana 2 y, aunque se proyecta recuperación parcial, no es seguro asumir estado 'descargado' sin confirmación de métricas; la altitud de Bogotá eleva el estrés cardiovascular un 10–15% adicional, lo que refuerza mantener Z1 puro. Duración conservadora de 40 min para añadir volumen aeróbico sin interferir con la recuperación. Las señales actuales (HRV promedio 42.6 ms con tendencia bajista, FC reposo con pico de 67 bpm, sueño promedio 62/100 con noches de 37 y 55) indican que incluso en semana 2 el margen para trabajo Z2 es escaso.\",\"updatedDate\":\"2026-08-24T02:54:20.0\",\"createdDate\":\"2026-08-24T02:54:20.0\",\"sportType\":{\"sportTypeId\":2,\"sportTypeKey\":\"cycling\",\"displayOrder\":2},\"subSportType\":null,\"trainingPlanId\":null,\"author\":{\"userProfilePk\":122925975,\"displayName\":\"2b5b14c4-2271-4b82-969f-d578be4652bf\",\"fullName\":\"Jose Martin Perilla\",\"profileImgNameLarge\":null,\"profileImgNameMedium\":\"dfac5bcf-d36f-41ec-b546-5b2543af2d3d-prfr.png\",\"profileImgNameSmall\":\"dfac5bcf-d36f-41ec-b546-5b2543af2d3d-prth.png\",\"userPro\":false,\"vivokidUser\":false},\"sharedWithUsers\":null,\"estimatedDurationInSecs\":2400,\"estimatedDistanceInMeters\":null,\"workoutSegments\":[{\"segmentOrder\":1,\"sportType\":{\"sportTypeId\":2,\"sportTypeKey\":\"cycling\",\"displayOrder\":2},\"poolLengthUnit\":null,\"poolLength\":null,\"avgTrainingSpeed\":null,\"estimatedDurationInSecs\":null,\"estimatedDistanceInMeters\":null,\"estimatedDistanceUnit\":null,\"estimateType\":null,\"description\":null,\"workoutSteps\":[{\"type\":\"ExecutableStepDTO\",\"stepId\":14391686819,\"stepOrder\":1,\"stepType\":{\"stepTypeId\":1,\"stepTypeKey\":\"warmup\",\"displayOrder\":1},\"childStepId\":null,\"description\":\"6 min | Pedaleo suave hasta encontrar ritmo | FC