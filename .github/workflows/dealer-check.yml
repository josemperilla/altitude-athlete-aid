name: dealer-check

on:
  push:
    branches: ['dealer/**']
  pull_request:
    branches: ['**']

jobs:
  ownership:
    # Solo aplica a ramas de carril
    if: startsWith(github.head_ref || github.ref_name, 'dealer/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesita historia completa para merge-base

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validar propiedad de archivos
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          LANE=$(echo "$BRANCH" | cut -d'/' -f2)
          echo "carril detectado: $LANE"
          python3 .dealer/dealer_check.py --lane "$LANE"
