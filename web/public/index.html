<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Gimnasio · Medio maratón 4-oct</title>
<link rel="manifest" href="/app.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="shell">
  <header class="masthead">
    <div class="mast-top">
      <div class="mast-id">
        <p class="eyebrow">Bogotá · 2.600 m</p>
        <h1 id="hTitle">Bloque de fuerza</h1>
      </div>
      <div class="count">
        <div class="count-cell">
          <b id="cDays">—</b><span>días<br>pa la carrera</span>
        </div>
        <div class="count-cell">
          <b id="cSessions">—</b><span>sesiones<br>restantes</span>
        </div>
      </div>
    </div>
    <!-- Progreso del bloque: sesiones del plan que ya quedaron atrás. Sin esto
         la cuenta de días es un número suelto que no dice dónde va uno. -->
    <div class="track" id="track" role="progressbar" aria-label="Progreso del bloque de fuerza"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <i id="trackFill"></i>
    </div>
  </header>

  <main>
    <section id="v-hoy" class="view active" aria-labelledby="t-hoy"></section>
    <section id="v-sesiones" class="view" aria-labelledby="t-sesiones"></section>
    <section id="v-plan" class="view" aria-labelledby="t-plan"></section>
    <section id="v-reglas" class="view" aria-labelledby="t-reglas"></section>
  </main>

  <footer class="foot">
    <p class="fmeta" id="fMeta">—</p>
    <p>Generado por el Entrenador a partir de tu calendario de Garmin.
    No sustituye la valoración de un fisioterapeuta o médico deportivo.</p>
  </footer>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" id="t-hoy" aria-controls="v-hoy" aria-selected="true" data-view="hoy">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6" class="dot"/></svg>
    Hoy</button>
  <button role="tab" id="t-sesiones" aria-controls="v-sesiones" aria-selected="false" data-view="sesiones">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h9"/></svg>
    Sesiones</button>
  <button role="tab" id="t-plan" aria-controls="v-plan" aria-selected="false" data-view="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 2.8V7M15 2.8V7"/></svg>
    Plan</button>
  <button role="tab" id="t-reglas" aria-controls="v-reglas" aria-selected="false" data-view="reglas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.5 20.5h19L12 3.5z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.6" r="0.4" class="dot"/></svg>
    Reglas</button>
</nav>

<script type="module" src="/app.js"></script>
<script>
  // Registro fuera de app.js para que un fallo del módulo no deje la app sin
  // caché offline, que es justo lo que hay que preservar cuando algo falla.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
